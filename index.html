<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POS Tạp Hóa Mỹ Lệ</title>
  
  <!-- Cấu hình PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6b4f">
  
  <!-- Thư viện -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root{ --green:#0d6b4f; --bg:#f4f6f9; }
    body{ background:var(--bg); font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    .pos-card{ border-radius:14px; }
    .sticky-head{ position:sticky; top:0; z-index:10; }
    .touch-btn{ min-height:48px; }
    .money{ font-variant-numeric:tabular-nums; }
    .cart-name{ font-weight:700; color:#155e4a; }
    .qty-input{ min-width:70px; }
    
    #camera-container{ display:none; position:relative; overflow:hidden; border-radius:10px; border:2px solid var(--green); margin:10px 0; background:#000; }
    #reader{ width:100%; }
    
    .bridge-status{ font-size:13px; font-weight:700; padding:7px 12px; border-radius:20px; display:inline-flex; align-items:center; gap:6px; }
    .status-checking{ background:#e9ecef; color:#6c757d; }
    .status-android{ background:#d1e7dd; color:#0f5132; }
    .status-pc-online{ background:#cfe2ff; color:#084298; }
    .status-pc-offline{ background:#f8d7da; color:#842029; }
    .status-net-offline{ background:#ffcccc; color:#d32f2f; margin-left: 8px; }

    .search-wrap{ position:relative; }
    #productSuggestions{ position:absolute; left:0; right:0; top:100%; z-index:1050; background:#fff; border:1px solid #ced4da; border-radius: 0 0 10px 10px; box-shadow: 0 8px 20px rgba(0,0,0,.12); max-height:330px; overflow:auto; display:none; }
    .product-option{ padding:12px 14px; border-bottom:1px solid #eee; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .product-option:hover, .product-option:active{ background:#eaf7f1; }
    .product-option .name{ font-weight:700; color:#174f3e; }
    .product-option .meta{ font-size:12px; color:#6c757d; }
    .product-option .price{ font-weight:800; color:#dc3545; white-space:nowrap; }

    @media(max-width:767px){
      .container-fluid{ padding:8px!important; }
      .table{ font-size:13px; }
      .table th:nth-child(1), .table td:nth-child(1){ display:none; }
      .table th:nth-child(4), .table td:nth-child(4){ display:none; }
      .bridge-status{ font-size:11px; padding: 5px 8px; }
    }
  </style>
</head>
<body>

<div class="container-fluid py-3">
  <!-- HEADER -->
  <div class="card border-0 shadow-sm mb-3 pos-card">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center gap-2">
        <div>
          <h4 class="fw-bold text-success mb-1"><i class="bi bi-shop"></i> TẠP HÓA MỸ LỆ</h4>
          <div class="text-muted">THU NGÂN – CHI NHÁNH LONG PHÚ</div>
        </div>
        <div class="text-end">
          <div id="bridgeStatus" class="bridge-status status-checking"><i class="bi bi-arrow-repeat"></i> Bridge...</div>
          <div id="networkStatus" class="bridge-status status-net-offline" style="display:none;"><i class="bi bi-wifi-off"></i> Ngoại tuyến</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN LÀM VIỆC -->
  <div class="row g-3">
    <!-- CỘT ĐIỀU KHIỂN -->
    <div class="col-lg-4">
      <div class="card border-0 shadow-sm pos-card">
        <div class="card-body">
          <h5 class="text-success fw-bold border-bottom pb-2 mb-3">BẢNG ĐIỀU KHIỂN</h5>

          <label class="fw-bold mb-1 text-primary"><i class="bi bi-person-badge"></i> SĐT Khách (Tích điểm)</label>
          <input type="tel" inputmode="numeric" id="sdtKhachInput" class="form-control form-control-lg mb-3 border-primary" placeholder="Bỏ trống nếu khách vãng lai" autocomplete="tel">

          <label class="fw-bold mb-2">Quét mã vạch / chọn sản phẩm (F2)</label>
          <div class="search-wrap">
            <div class="d-flex gap-2">
              <input type="text" id="maVachInput" class="form-control form-control-lg border-success fw-bold" placeholder="Quét mã hoặc gõ tên..." autocomplete="off" autocapitalize="off" spellcheck="false"
                     oninput="APP_POS.renderSuggestions(this.value)"
                     onfocus="if(this.value.trim().length > 0) APP_POS.renderSuggestions(this.value.trim())"
                     onkeydown="if(event.key === 'Enter'){ event.preventDefault(); var val=this.value.trim(); APP_POS.hideSuggestions(); if(val) APP_POS.xuLyMaVach(val); }">
              <button class="btn btn-dark fw-bold touch-btn text-nowrap" id="btnToggleCamera" type="button" onclick="APP_POS.toggleCamera()">
                <i class="bi bi-camera-video-fill"></i> MỞ CAM
              </button>
            </div>
            <div id="productSuggestions"></div>
          </div>

          <div id="camera-container"><div id="reader"></div></div>

          <!-- NÚT CHỨC NĂNG -->
          <div class="mt-3 d-grid gap-2" id="action-buttons">
            <button type="button" class="btn btn-outline-primary btn-lg fw-bold touch-btn" onclick="APP_POS.moFormSanPhamMo()">
              <i class="bi bi-plus-circle"></i> HÀNG TỰ DO (F4)
            </button>
            <button type="button" class="btn btn-success btn-lg fw-bold touch-btn" id="btnThanhToan" onclick="APP_POS.thanhToan()">
              <i class="bi bi-cash-coin"></i> THANH TOÁN (F12)
            </button>
            <button type="button" class="btn btn-outline-danger fw-bold touch-btn" onclick="APP_POS.huyDon()">
              <i class="bi bi-trash"></i> HỦY ĐƠN (ESC)
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- CỘT GIỎ HÀNG -->
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm pos-card">
        <div class="card-body">
          <div class="table-responsive" style="max-height:58vh;overflow-y:auto">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-success sticky-head">
                <tr>
                  <th>#</th>
                  <th>Sản phẩm</th>
                  <th class="text-center">Số lượng</th>
                  <th class="text-end">Đơn giá</th>
                  <th class="text-end">Thành tiền</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="gioHang">
                <tr><td colspan="6" class="text-center text-muted py-5">Chưa có sản phẩm nào trong đơn hàng</td></tr>
              </tbody>
            </table>
          </div>

          <!-- CHIẾT KHẤU & TỔNG TIỀN -->
          <div class="mt-3 pt-3 border-top">
            <div class="row g-3 align-items-end">
              <div class="col-md-6">
                <label class="fw-bold mb-1 text-primary"><i class="bi bi-tag-fill"></i> Chiết khấu / Giảm giá</label>
                <div class="input-group">
                  <span class="input-group-text fw-bold">%</span>
                  <input type="number" id="inputGiamGiaPT" class="form-control text-center fw-bold text-primary fs-5" min="0" max="100" value="0" inputmode="decimal" oninput="APP_POS.tinhGiamGia('PT')">
                  <span class="input-group-text fw-bold">VNĐ</span>
                  <input type="number" id="inputGiamGiaVND" class="form-control text-end fw-bold text-danger fs-5" min="0" value="0" inputmode="numeric" oninput="APP_POS.tinhGiamGia('VND')">
                </div>
              </div>

              <div class="col-md-6 text-end">
                <div class="text-muted fw-bold">Tạm tính: <span id="txtTamTinh">0</span> đ</div>
                <div id="divHienThiGiamGia" class="text-danger fw-bold" style="display:none">Giảm giá: -<span id="txtTienGiam">0</span> đ</div>
                <div class="fs-3 text-success fw-bold mt-1">KHÁCH TRẢ: <span id="txtTongTien">0</span> đ</div>
              </div>
            </div>
          </div>
          <div id="mobile-button-container" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL HÀNG TỰ DO -->
<div class="modal fade" id="modalSanPhamMo" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold"><i class="bi bi-box-seam"></i> THÊM HÀNG TỰ DO</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form id="formSanPhamMo" onsubmit="APP_POS.themSanPhamMo(event)">
        <div class="modal-body">
          <div class="mb-3">
            <label class="fw-bold">Tên mặt hàng / Dịch vụ</label>
            <input id="spm_ten" class="form-control form-control-lg" required>
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="fw-bold">Đơn giá (VNĐ)</label>
              <input id="spm_gia" type="number" class="form-control form-control-lg fw-bold" required min="0" step="1000" inputmode="numeric">
            </div>
            <div class="col-6">
              <label class="fw-bold">Số lượng</label>
              <input id="spm_sl" type="number" class="form-control form-control-lg fw-bold text-center" required min="1" value="1" inputmode="numeric">
            </div>
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary fw-bold">THÊM VÀO GIỎ</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL THANH TOÁN -->
<div class="modal fade" id="modalThanhToan" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title fw-bold"><i class="bi bi-qr-code-scan"></i> XÁC NHẬN THANH TOÁN</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center py-4">
        <div class="text-muted fw-bold">KHÁCH TRẢ</div>
        <h2 class="text-danger fw-bold mb-3" id="tt_tongTien">0 đ</h2>
        <div class="small text-muted mb-2">
          Tạm tính: <b id="tt_tamTinh">0</b> đ
          <span id="tt_giamWrap" style="display:none">&nbsp;•&nbsp; Giảm: <b class="text-danger">-<span id="tt_giam">0</span></b> đ</span>
        </div>
        <div class="p-2 bg-light rounded d-inline-block border">
          <img id="imgVietQR" src="" alt="VietQR" class="img-fluid rounded" style="width:250px; height:250px; object-fit:contain">
        </div>
      </div>
      <div class="modal-footer bg-light d-flex justify-content-between">
        <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">QUAY LẠI (ESC)</button>
        <button type="button" class="btn btn-success fw-bold px-4 fs-5" id="btnChotDon" onclick="APP_POS.chotDonHang()">XÁC NHẬN HOÀN TẤT</button>
      </div>
    </div>
  </div>
</div>

<!-- KỊCH BẢN JAVASCRIPT LÕI -->
<script>
window.APP_POS = (function() {
  'use strict';

  // ========================================================
  // CẤU HÌNH API GIAO TIẾP VỚI GOOGLE APPS SCRIPT
  // ========================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbxz7SzvgAEcbWjl2qng1VlP9xG29VDyJmLCtOXzUHKs9zpqbH490G98kkBg2LdPhQv1Ug/exec"; 
  const SECRET_API_KEY = "MyLePOS-2026-SecureKey";

  const CONFIG = {
    NGAN_HANG: 'MB', STK: '1108199309999', CHU_TAI_KHOAN: 'LIEU QUANG THONG',
    PC_BRIDGE_URL: 'http://127.0.0.1:8765/print', PC_HEALTH_URL: 'http://127.0.0.1:8765/',
    ANDROID_URI: 'myleprint://print', MAX_PAYLOAD: 12000, STORE_NAME: 'TẠP HÓA MỸ LỆ',
    ADDRESS: 'Ấp 3, Xã Long Phú, TP. Cần Thơ', PHONE: '0389707994', FOOTER: 'Cảm ơn quý khách! Hẹn gặp lại!'
  };

  let gioHangData = [], products = [], scanner = null, isCamOn = false, scanLocked = false;
  let printing = false, tamTinh = 0, giamGia = 0, tongTienThanhToan = 0, audioCtx = null;

  // Helpers
  function num(val) { const n = Number(val); return isNaN(n) ? 0 : n; }
  function money(val) { return Math.round(num(val)).toLocaleString('vi-VN'); }
  function esc(val) { return String(val || '').replace(/[&<>'"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'}[c])); }
  function focusInput() { setTimeout(() => { const i = document.getElementById('maVachInput'); if(i){ i.focus(); i.select(); } }, 50); }
  function beep() {
    try {
      if(!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880; gain.gain.value = 0.08;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    } catch(e){}
  }

  // Cập nhật trạng thái Mạng
  function updateNetworkStatus() {
    const netEl = document.getElementById('networkStatus');
    if (navigator.onLine) {
      netEl.style.display = 'none';
      dongBoDonHangOffline(); // Tự động đẩy đơn khi có mạng
    } else {
      netEl.style.display = 'inline-flex';
    }
  }

  // ========================================================
  // OFFLINE STORAGE (INDEXED DB)
  // ========================================================
  class ProductStore {
    constructor(){ this.dbName = 'MyLePOS_DB'; this.sProd = 'Products'; this.sOrder = 'OfflineOrders'; this.dbVersion=2; this.db=null; }
    async init(){
      return new Promise((resolve,reject)=>{
        const req = indexedDB.open(this.dbName, this.dbVersion);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if(!db.objectStoreNames.contains(this.sProd)){ const st = db.createObjectStore(this.sProd, {keyPath:'maSP'}); st.createIndex('tenSP', 'tenSP', {unique:false}); }
          if(!db.objectStoreNames.contains(this.sOrder)) db.createObjectStore(this.sOrder, {keyPath:'id'});
        };
        req.onsuccess = e => { this.db = e.target.result; resolve(true); };
        req.onerror = e => reject(e.target.error);
      });
    }
    async saveProducts(list){
      if(!this.db)return;
      return new Promise((resolve,reject)=>{
        const tx = this.db.transaction([this.sProd], 'readwrite'), store = tx.objectStore(this.sProd);
        store.clear(); (list||[]).forEach(p => { if(p && p.maSP != null) store.put(p); });
        tx.oncomplete=resolve; tx.onerror = e => reject(e.target.error);
      });
    }
    async getByBarcode(code){
      if(!this.db)return null;
      return new Promise(res => {
        const r = this.db.transaction([this.sProd], 'readonly').objectStore(this.sProd).get(String(code));
        r.onsuccess = e => res(e.target.result || null); r.onerror = () => res(null);
      });
    }
    async getByName(name){
      if(!this.db)return null;
      return new Promise(res => {
        const r = this.db.transaction([this.sProd], 'readonly').objectStore(this.sProd).index('tenSP').get(String(name));
        r.onsuccess = e => res(e.target.result || null); r.onerror = () => res(null);
      });
    }
    async saveOfflineOrder(order) {
      if(!this.db)return;
      return new Promise(res => {
        const tx = this.db.transaction([this.sOrder], 'readwrite');
        tx.objectStore(this.sOrder).put(order); tx.oncomplete = () => res(true);
      });
    }
    async getOfflineOrders() {
      if(!this.db)return [];
      return new Promise(res => {
        const r = this.db.transaction([this.sOrder], 'readonly').objectStore(this.sOrder).getAll();
        r.onsuccess = e => res(e.target.result || []); r.onerror = () => res([]);
      });
    }
    async deleteOfflineOrder(id) {
      if(!this.db)return;
      return new Promise(res => {
        const tx = this.db.transaction([this.sOrder], 'readwrite');
        tx.objectStore(this.sOrder).delete(id); tx.oncomplete = () => res(true);
      });
    }
  }
  const localDb = new ProductStore();

  // ========================================================
  // API GIAO TIẾP VỚI GOOGLE SHEETS
  // ========================================================
  async function taiDuLieuTuServer() {
    if (!navigator.onLine) return;
    try {
      // 1. Lấy thông tin Ngân hàng
      let resBank = await fetch(API_URL + "?action=layThongTinNganHang&apiKey=" + SECRET_API_KEY);
      let dataBank = await resBank.json();
      if(dataBank && dataBank.stk) {
        CONFIG.NGAN_HANG = dataBank.nganHang; CONFIG.STK = dataBank.stk; CONFIG.CHU_TAI_KHOAN = dataBank.chuTaiKhoan;
      }
      
      // 2. Lấy Sản phẩm
      let resProd = await fetch(API_URL + "?action=layDanhSachSanPham&apiKey=" + SECRET_API_KEY);
      products = await resProd.json();
      await localDb.saveProducts(products);
    } catch (e) { console.error("Lỗi đồng bộ API:", e); }
  }

  async function dongBoDonHangOffline() {
    if (!navigator.onLine) return;
    let pending = await localDb.getOfflineOrders();
    if (pending.length === 0) return;
    for (let order of pending) {
      try {
        let payload = { action: "luuDonHang", apiKey: SECRET_API_KEY, gioHang: order.gioHang, tongTien: order.tongCong, sdtKhach: order.sdtKhach };
        await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        await localDb.deleteOfflineOrder(order.id);
      } catch (e) { break; } // Bị kẹt mạng lại thì ngừng đồng bộ
    }
    taiDuLieuTuServer(); // Refresh kho
  }

  // ========================================================
  // MÁY IN VÀ KIỂM TRA BRIDGE
  // ========================================================
  function kiemTraBridge() {
    const el = document.getElementById('bridgeStatus');
    if(!el) return;
    if(/Android/i.test(navigator.userAgent)){ el.className = 'bridge-status status-android'; el.innerHTML = '<i class="bi bi-phone"></i> ANDROID BRIDGE'; return; }
    fetch(CONFIG.PC_HEALTH_URL, { method:'GET', cache:'no-store' })
      .then(res => {
        if(res.ok){ el.className = 'bridge-status status-pc-online'; el.innerHTML = '<i class="bi bi-printer-fill"></i> PC BRIDGE: ONLINE'; }
        else throw new Error();
      }).catch(() => {
        el.className = 'bridge-status status-pc-offline'; el.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i> PC BRIDGE: OFFLINE';
      });
  }

  const Printer = {
    vf: (tag, val) => { const s = String(val||''); return tag + String(s.length).padStart(2,'0') + s; },
    crc: (text) => {
      let crc=0xFFFF;
      for(let i=0; i<text.length; i++){
        crc ^= text.charCodeAt(i) << 8;
        for(let b=0; b<8; b++){ crc = (crc & 0x8000) ? ((crc<<1) ^0x1021) : (crc<<1); crc &= 0xFFFF; }
      }
      return crc.toString(16).toUpperCase().padStart(4, '0');
    },
    buildQR: (amount, info) => {
      const acc = Printer.vf('00', 'A000000727') + Printer.vf('01', Printer.vf('00', '970422') + Printer.vf('01', CONFIG.STK));
      const body = Printer.vf('00', '01') + Printer.vf('01', '12') + Printer.vf('38', acc + Printer.vf('02', 'QRIBFTTA')) + Printer.vf('53', '704') + Printer.vf('54', String(Math.floor(num(amount)))) + Printer.vf('58', 'VN') + Printer.vf('59', CONFIG.CHU_TAI_KHOAN) + Printer.vf('60', 'CAN THO') + Printer.vf('62', Printer.vf('08', String(info||'').substring(0, 25))) + '6304';
      return body + Printer.crc(body);
    },
    print: async (maDH, snapshot, sdt) => {
      const payload = JSON.stringify({
        storeName: CONFIG.STORE_NAME, address: CONFIG.ADDRESS, phone: CONFIG.PHONE, customerPhone: String(sdt||''), orderId: maDH,
        date: new Date().toLocaleString('vi-VN'), items: snapshot.map(i => ({ name: String(i.tenSP), qty: num(i.soLuong), price: num(i.donGia), total: num(i.thanhTien) })),
        subtotal: tamTinh, discount: giamGia, total: tongTienThanhToan, qrData: Printer.buildQR(tongTienThanhToan, maDH), footer: CONFIG.FOOTER
      });

      if(/Android/i.test(navigator.userAgent)){
        const b64 = btoa(unescape(encodeURIComponent(payload))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
        window.location.assign(CONFIG.ANDROID_URI + '/?payload=' + encodeURIComponent(b64));
        return { mode: 'ANDROID' };
      } else {
        const res = await fetch(CONFIG.PC_BRIDGE_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: payload });
        if(!res.ok) throw new Error('Lỗi in HTTP');
        return { mode: 'PC' };
      }
    }
  };

  // ========================================================
  // LOGIC POS - SẢN PHẨM & GIỎ HÀNG
  // ========================================================
  function renderSuggestions(query) {
    const box = document.getElementById('productSuggestions'), q = String(query||'').trim().toLowerCase();
    if(!q){ box.style.display='none'; return; }
    const matches = products.filter(p => String(p.tenSP||'').toLowerCase().includes(q) || String(p.maSP||'').toLowerCase().includes(q)).slice(0,30);
    if(!matches.length){ box.innerHTML = '<div class="p-3 text-muted">Không tìm thấy</div>'; box.style.display='block'; return; }
    
    box.innerHTML = matches.map((p,i) => `
      <div class="product-option" onpointerdown="APP_POS.chonGoiY(${i}, event)">
        <div><div class="name">${esc(p.tenSP)}</div><div class="meta">Mã: ${esc(p.maSP)} • Tồn: ${num(p.tonKho)}</div></div>
        <div class="price">${money(p.giaBan)} đ</div>
      </div>
    `).join('');
    box.style.display = 'block';
  }

  function hideSuggestions() { document.getElementById('productSuggestions').style.display = 'none'; }
  function chonGoiY(index, event) {
    event.preventDefault();
    const q = document.getElementById('maVachInput').value.trim().toLowerCase();
    const matches = products.filter(p => String(p.tenSP||'').toLowerCase().includes(q) || String(p.maSP||'').toLowerCase().includes(q));
    if(matches[index]) addProduct(matches[index]);
    document.getElementById('maVachInput').value = ''; hideSuggestions(); focusInput();
  }

  function addProduct(product) {
    beep();
    const idx = gioHangData.findIndex(item => String(item.maSP) === String(product.maSP));
    if(idx >= 0){ gioHangData[idx].soLuong++; gioHangData[idx].thanhTien = gioHangData[idx].soLuong * gioHangData[idx].donGia; } 
    else { gioHangData.push({ maSP: product.maSP, tenSP: product.tenSP, donGia: num(product.giaBan), soLuong: 1, thanhTien: num(product.giaBan) }); }
    capNhatUI();
  }

  async function xuLyMaVach(val) {
    const v = String(val||'').trim(); if(!v) return;
    let found = await localDb.getByBarcode(v);
    if(!found) found = await localDb.getByName(v);
    if(found){ addProduct(found); } else { if(!scanLocked) alert('Không tìm thấy: ' + v); }
    document.getElementById('maVachInput').value = ''; hideSuggestions(); focusInput();
  }

  function capNhatUI() {
    const tbody = document.getElementById('gioHang');
    tamTinh = gioHangData.reduce((sum, item) => sum + num(item.thanhTien), 0);
    
    if(!gioHangData.length){
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">Giỏ hàng trống</td></tr>';
      tinhGiamGia('UPDATE'); return;
    }
    
    tbody.innerHTML = [...gioHangData].reverse().map((item, revIdx) => {
      const idx = gioHangData.length - 1 - revIdx;
      return `<tr>
        <td>${idx+1}</td><td class="cart-name">${esc(item.tenSP)}</td>
        <td><input type="number" min="1" value="${num(item.soLuong)}" class="form-control form-control-sm text-center fw-bold qty-input" onchange="APP_POS.suaSL(${idx}, this.value)"></td>
        <td class="text-end money">${money(item.donGia)}</td><td class="text-danger fw-bold text-end money">${money(item.thanhTien)}</td>
        <td class="text-center"><button class="btn btn-sm btn-outline-danger" onclick="APP_POS.xoaSP(${idx})"><i class="bi bi-x-lg"></i></button></td>
      </tr>`;
    }).join('');
    tinhGiamGia('UPDATE');
  }

  function suaSL(idx, val) { const q = Math.floor(num(val)); if(q>0){ gioHangData[idx].soLuong = q; gioHangData[idx].thanhTien = q * gioHangData[idx].donGia; capNhatUI(); } }
  function xoaSP(idx) { gioHangData.splice(idx, 1); capNhatUI(); }
  function huyDon() { if(gioHangData.length && confirm('Xác nhận hủy?')){ gioHangData=[]; document.getElementById('sdtKhachInput').value=''; document.getElementById('inputGiamGiaPT').value=0; document.getElementById('inputGiamGiaVND').value=0; capNhatUI(); focusInput(); } }

  function tinhGiamGia(mode) {
    const ptEl = document.getElementById('inputGiamGiaPT'), vndEl = document.getElementById('inputGiamGiaVND');
    let pt = num(ptEl.value), vnd = Math.floor(num(vndEl.value));
    
    if(!gioHangData.length){ ptEl.value=0; vndEl.value=0; giamGia=0; tongTienThanhToan=0; renderTong(); return; }
    if(mode === 'PT'){ pt = Math.min(100, Math.max(0, pt)); vnd = Math.round(tamTinh * pt / 100); vndEl.value = vnd; } 
    else { vnd = Math.min(tamTinh, Math.max(0, vnd)); pt = tamTinh ? (vnd / tamTinh * 100) : 0; ptEl.value = Number.isInteger(pt) ? pt : pt.toFixed(2); }
    
    giamGia = vnd; tongTienThanhToan = Math.max(0, tamTinh - giamGia); renderTong();
  }

  function renderTong() {
    document.getElementById('txtTamTinh').textContent = money(tamTinh);
    document.getElementById('txtTongTien').textContent = money(tongTienThanhToan);
    document.getElementById('txtTienGiam').textContent = money(giamGia);
    document.getElementById('divHienThiGiamGia').style.display = giamGia > 0 ? 'block' : 'none';
  }

  function moFormSanPhamMo() { bootstrap.Modal.getOrCreateInstance(document.getElementById('modalSanPhamMo')).show(); }
  function themSanPhamMo(event) {
    event.preventDefault();
    const ten = document.getElementById('spm_ten').value.trim(), gia = Math.max(0, Math.floor(num(document.getElementById('spm_gia').value))), sl = Math.max(1, Math.floor(num(document.getElementById('spm_sl').value)));
    if(!ten) return;
    gioHangData.push({ maSP: 'SPM-' + Date.now(), tenSP: '[Tự do] ' + ten, donGia: gia, soLuong: sl, thanhTien: gia * sl });
    capNhatUI(); bootstrap.Modal.getInstance(document.getElementById('modalSanPhamMo'))?.hide(); event.target.reset(); focusInput();
  }

  // ========================================================
  // THANH TOÁN VÀ CHỐT ĐƠN (HỖ TRỢ OFFLINE)
  // ========================================================
  function thanhToan() {
    if(!gioHangData.length){ alert('Giỏ hàng rỗng!'); return; }
    const addInfo = 'DH-' + Date.now();
    document.getElementById('tt_tongTien').textContent = money(tongTienThanhToan) + ' VNĐ';
    document.getElementById('tt_tamTinh').textContent = money(tamTinh);
    document.getElementById('tt_giam').textContent = money(giamGia);
    document.getElementById('tt_giamWrap').style.display = giamGia > 0 ? 'inline' : 'none';
    document.getElementById('imgVietQR').src = `https://img.vietqr.io/image/${CONFIG.NGAN_HANG}-${CONFIG.STK}-compact.png?amount=${tongTienThanhToan}&addInfo=${encodeURIComponent(addInfo)}&accountName=${encodeURIComponent(CONFIG.CHU_TAI_KHOAN)}`;
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalThanhToan')).show();
  }

  async function chotDonHang() {
    if(printing || !gioHangData.length) return;
    const sdt = document.getElementById('sdtKhachInput').value.trim(), btn = document.getElementById('btnChotDon');
    printing = true; btn.disabled = true; btn.innerHTML = 'ĐANG XỬ LÝ...';
    
    const snapshot = JSON.parse(JSON.stringify(gioHangData)), total = tongTienThanhToan;
    
    // OFFLINE MODE
    if (!navigator.onLine) {
      const maDHOffline = "OFF-" + Date.now();
      await localDb.saveOfflineOrder({ id: maDHOffline, gioHang: snapshot, tongCong: total, sdtKhach: sdt });
      try { await Printer.print(maDHOffline, snapshot, sdt); } catch(e){}
      resetSauIn(btn); alert("LƯU TẠM NGOẠI TUYẾN: Sẽ đồng bộ khi có mạng.");
      return;
    }

    // ONLINE MODE
    try {
      const payload = { action: "luuDonHang", apiKey: SECRET_API_KEY, gioHang: snapshot, tongTien: total, sdtKhach: sdt };
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
      const json = await res.json();
      
      if (json.status === "success") {
        const parts = String(json.data || '').split('\n');
        const maDH = parts[0].split('Mã hóa đơn: ')[1] || parts[0].trim();
        
        try {
          const pr = await Printer.print(maDH, snapshot, sdt);
          if(pr.mode === 'ANDROID') alert('Đã gửi tới ứng dụng in MylePrint.');
          else if(parts.length > 1 && parts[1]) alert(parts[1]);
        } catch(err) { alert('Lưu thành công, nhưng in thất bại: ' + err); }

        resetSauIn(btn);
        taiDuLieuTuServer(); // refresh kho
      } else { throw new Error(json.message); }
    } catch (e) {
      alert("Lỗi máy chủ: " + e.message);
      printing = false; btn.disabled = false; btn.innerHTML = 'XÁC NHẬN HOÀN TẤT';
    }
  }

  function resetSauIn(btn) {
    gioHangData = []; document.getElementById('sdtKhachInput').value = '';
    document.getElementById('inputGiamGiaPT').value = 0; document.getElementById('inputGiamGiaVND').value = 0;
    capNhatUI(); bootstrap.Modal.getInstance(document.getElementById('modalThanhToan'))?.hide();
    printing = false; btn.disabled = false; btn.innerHTML = 'XÁC NHẬN HOÀN TẤT'; focusInput();
  }

  // ========================================================
  // CAMERA
  // ========================================================
  function toggleCamera() {
    if(typeof Html5Qrcode === 'undefined'){ alert('Thư viện quét mã vạch chưa tải xong!'); return; }
    const btn = document.getElementById('btnToggleCamera'), box = document.getElementById('camera-container');
    if(isCamOn){
      if(scanner) scanner.stop().then(() => { box.style.display='none'; btn.className='btn btn-dark fw-bold touch-btn'; btn.innerHTML='<i class="bi bi-camera-video-fill"></i> MỞ CAM'; isCamOn=false; focusInput(); }).catch(()=>{});
      return;
    }
    box.style.display='block'; btn.className='btn btn-danger fw-bold touch-btn'; btn.innerHTML='<i class="bi bi-stop-circle-fill"></i> TẮT CAM'; isCamOn=true;
    scanner = new Html5Qrcode('reader');
    scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 250, height: 100 }, aspectRatio: 1 }, text => {
      if(scanLocked) return; scanLocked = true; beep(); if(navigator.vibrate) navigator.vibrate(100);
      xuLyMaVach(text); setTimeout(() => { scanLocked = false; }, 1200);
    }, () => {}).catch(err => { isCamOn=false; box.style.display='none'; btn.className='btn btn-dark fw-bold touch-btn'; btn.innerHTML='<i class="bi bi-camera-video-fill"></i> MỞ CAM'; alert('Lỗi Camera: Cần cấp quyền hoặc chạy HTTPS'); });
  }

  // ========================================================
  // KHỞI ĐỘNG HỆ THỐNG
  // ========================================================
  function init() {
    focusInput(); kiemTraBridge(); updateNetworkStatus();
    
    // Responsive di chuyển nút
    if(/Android/i.test(navigator.userAgent) || window.innerWidth < 992) {
      const btnBlock = document.getElementById('action-buttons'), tContainer = document.getElementById('mobile-button-container');
      if(btnBlock && tContainer) tContainer.appendChild(btnBlock);
    }
    
    // Gắn sự kiện Mạng
    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

    localDb.init().then(() => {
      // Khôi phục cache local trước để dùng ngay, tải nền API sau
      localDb.getOfflineOrders().then(o => { if(o.length) dongBoDonHangOffline(); });
      taiDuLieuTuServer();
    }).catch(console.error);
  }

  // Export API Public
  return {
    init, renderSuggestions, hideSuggestions, chonGoiY, xuLyMaVach, toggleCamera, moFormSanPhamMo, themSanPhamMo, 
    thanhToan, huyDon, chotDonHang, tinhGiamGia, suaSL, xoaSP
  };
})();

// Bắt đầu ứng dụng và gắn phím tắt
window.addEventListener('load', () => {
  APP_POS.init();

  document.addEventListener('pointerdown', e => { if(!e.target.closest('.search-wrap')) APP_POS.hideSuggestions(); });
  document.addEventListener('keydown', e => {
    if(e.key === 'F12'){ e.preventDefault(); APP_POS.thanhToan(); }
    else if(e.key === 'F2'){ e.preventDefault(); const i=document.getElementById('maVachInput'); if(i){ i.focus(); i.select(); } }
    else if(e.key === 'F4'){ e.preventDefault(); APP_POS.moFormSanPhamMo(); }
    else if(e.key === 'Escape'){
      const m = document.getElementById('modalThanhToan');
      if(m && m.classList.contains('show')){ bootstrap.Modal.getInstance(m)?.hide(); } else { APP_POS.huyDon(); }
    }
    else if(e.key === 'Enter'){
      const mt = document.getElementById('modalThanhToan');
      if(mt && mt.classList.contains('show')){ e.preventDefault(); APP_POS.chotDonHang(); }
    }
  });

  // Tích hợp Service Worker cho PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.error('SW Error:', err));
  }
});
</script>
